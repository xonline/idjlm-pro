name: Desktop release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "idjlm.spec"
      - "run_app.py"
      - "requirements.txt"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon installer
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11 (arm64)
        uses: actions/setup-python@v5
        id: py-arm64
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Build PyInstaller sidecar
        run: |
          "${{ steps.py-arm64.outputs.python-path }}" -m pip install -r requirements.txt pyinstaller
          "${{ steps.py-arm64.outputs.python-path }}" -m PyInstaller idjlm.spec --clean \
            --distpath src-tauri/binaries/tmp
          mkdir -p src-tauri/binaries
          mv src-tauri/binaries/tmp/idjlm-server \
            src-tauri/binaries/idjlm-server-aarch64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target aarch64-apple-darwin

      - name: Verify DMG install layout and sidecar startup
        shell: bash
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_dir="$RUNNER_TEMP/idjlm-dmg-arm64"
          install_dir="$RUNNER_TEMP/idjlm-installed-arm64"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir"
          cleanup() {
            [ -n "${sidecar_pid:-}" ] && kill "$sidecar_pid" 2>/dev/null || true
            hdiutil detach "$mount_dir" -quiet || true
          }
          trap cleanup EXIT
          app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          cp -R "$app" "$install_dir/"
          installed_app="$install_dir/$(basename "$app")"
          test -x "$installed_app/Contents/MacOS/idjlm-pro"
          sidecar=$(find "$installed_app" -type f -name 'idjlm-server*' -print -quit)
          test -n "$sidecar" && test -x "$sidecar"
          IDJLM_HEADLESS=1 FLASK_PORT=5057 "$sidecar" >"$RUNNER_TEMP/idjlm-sidecar-arm64.log" 2>&1 &
          sidecar_pid=$!
          for _ in {1..60}; do
            curl --fail --silent http://127.0.0.1:5057/api/version >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/idjlm-sidecar-arm64.log"
          exit 1

      - name: Upload macOS Apple Silicon installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-dmg-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-macos-intel:
    name: Build macOS Intel installer
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11 (x86_64)
        uses: actions/setup-python@v5
        id: py-x64
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build PyInstaller sidecar
        run: |
          "${{ steps.py-x64.outputs.python-path }}" -m pip install -r requirements.txt pyinstaller
          "${{ steps.py-x64.outputs.python-path }}" -m PyInstaller idjlm.spec --clean \
            --distpath src-tauri/binaries/tmp
          mkdir -p src-tauri/binaries
          mv src-tauri/binaries/tmp/idjlm-server \
            src-tauri/binaries/idjlm-server-x86_64-apple-darwin

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target x86_64-apple-darwin

      - name: Verify DMG install layout and sidecar startup
        shell: bash
        run: |
          dmg=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          mount_dir="$RUNNER_TEMP/idjlm-dmg-intel"
          install_dir="$RUNNER_TEMP/idjlm-installed-intel"
          mkdir -p "$mount_dir" "$install_dir"
          hdiutil attach "$dmg" -nobrowse -mountpoint "$mount_dir"
          cleanup() {
            [ -n "${sidecar_pid:-}" ] && kill "$sidecar_pid" 2>/dev/null || true
            hdiutil detach "$mount_dir" -quiet || true
          }
          trap cleanup EXIT
          app=$(find "$mount_dir" -maxdepth 1 -name '*.app' -type d -print -quit)
          test -n "$app"
          cp -R "$app" "$install_dir/"
          installed_app="$install_dir/$(basename "$app")"
          test -x "$installed_app/Contents/MacOS/idjlm-pro"
          sidecar=$(find "$installed_app" -type f -name 'idjlm-server*' -print -quit)
          test -n "$sidecar" && test -x "$sidecar"
          IDJLM_HEADLESS=1 FLASK_PORT=5057 "$sidecar" >"$RUNNER_TEMP/idjlm-sidecar-intel.log" 2>&1 &
          sidecar_pid=$!
          for _ in {1..60}; do
            curl --fail --silent http://127.0.0.1:5057/api/version >/dev/null && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/idjlm-sidecar-intel.log"
          exit 1

      - name: Upload macOS Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-dmg-x86_64-apple-darwin
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build PyInstaller sidecar
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller idjlm.spec --clean --distpath src-tauri/binaries/tmp

      - name: Stage sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Move-Item src-tauri/binaries/tmp/idjlm-server.exe `
            src-tauri/binaries/idjlm-server-x86_64-pc-windows-msvc.exe

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target x86_64-pc-windows-msvc

      - name: Verify MSI installation and desktop startup
        shell: pwsh
        run: |
          $msi = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi | Select-Object -First 1
          if (-not $msi) { throw "MSI installer was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "idjlm-installed-windows"
          $installer = Start-Process msiexec.exe -ArgumentList @('/i', $msi.FullName, '/qn', '/norestart', "INSTALLDIR=$installDir") -PassThru
          if (-not $installer.WaitForExit(120000)) {
            Stop-Process -Id $installer.Id -Force
            throw "MSI installation exceeded the two-minute verification timeout"
          }
          $installer.Refresh()
          if ($installer.ExitCode -ne 0) { throw "MSI installation failed with exit code $($installer.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -Filter idjlm-pro.exe | Select-Object -First 1
          if (-not $app) { throw "Installed app executable was not found" }
          $process = Start-Process $app.FullName -PassThru
          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest http://127.0.0.1:5050/api/version -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch {}
              Start-Sleep -Seconds 1
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          if (-not $ready) { throw "Installed desktop app did not start its local server" }

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos-arm64
      - build-macos-intel
      - build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          pattern: idjlm-pro-*
          path: release-assets
          merge-multiple: true

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-assets/**/*.dmg
            release-assets/**/*.msi
            release-assets/**/*.exe
