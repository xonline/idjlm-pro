name: Desktop installer checks

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "idjlm.spec"
      - "run_app.py"
      - "app/__init__.py"
      - "app/routes/version_routes.py"
      - "app/static/app.js"
      - "app/static/modules/latin-redesign.js"
      - "templates/index.html"
      - "app/services/analyzer.py"
      - "app/models/track.py"
      - "requirements.txt"
      - "requirements-audio.txt"
      - "scripts/verify_audio_runtime.py"
      - "scripts/verify_macos_app_bundle.sh"
      - "scripts/verify_macos_desktop_ui.sh"
      - "package.json"
      - "package-lock.json"
      - "src-tauri/**"
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: Build macOS Apple Silicon installer
    # GitHub documents this standard arm64 image for public repositories.
    # Keep the architecture check below so a runner-label change cannot silently
    # produce an Intel review build.
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test "$(uname -m)" = "arm64" || { echo "Expected an arm64 macOS runner"; exit 1; }
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11 (arm64)
        uses: actions/setup-python@v5
        id: py-arm64
        with:
          python-version: "3.11"
          architecture: arm64

      - name: Build PyInstaller sidecar
        run: |
          "${{ steps.py-arm64.outputs.python-path }}" -m pip install -r requirements.txt -r requirements-audio.txt pyinstaller
          "${{ steps.py-arm64.outputs.python-path }}" scripts/verify_audio_runtime.py
          "${{ steps.py-arm64.outputs.python-path }}" -m PyInstaller idjlm.spec --clean \
            --distpath src-tauri/binaries/tmp
          src-tauri/binaries/tmp/idjlm-server --verify-audio-runtime
          mkdir -p src-tauri/binaries
          mv src-tauri/binaries/tmp/idjlm-server \
            src-tauri/binaries/idjlm-server-aarch64-apple-darwin

      - name: Verify spawned analyzer batch
        timeout-minutes: 5
        run: src-tauri/binaries/idjlm-server-aarch64-apple-darwin --verify-analyzer-runtime

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target aarch64-apple-darwin

      - name: Verify sealed Apple Silicon review bundle
        shell: bash
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          scripts/verify_macos_app_bundle.sh "$dmg" arm64 "$(cat VERSION)"

      - name: Verify installed desktop wrapper reaches Library UI
        shell: bash
        run: |
          dmg=$(find src-tauri/target/aarch64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          scripts/verify_macos_desktop_ui.sh "$dmg" arm64 "$(cat VERSION)"

      - name: Upload macOS Apple Silicon installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-dmg-aarch64-apple-darwin
          path: src-tauri/target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-macos-intel:
    name: Build macOS Intel installer
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11 (x86_64)
        uses: actions/setup-python@v5
        id: py-x64
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build PyInstaller sidecar
        run: |
          "${{ steps.py-x64.outputs.python-path }}" -m pip install -r requirements.txt pyinstaller
          "${{ steps.py-x64.outputs.python-path }}" -m PyInstaller idjlm.spec --clean \
            --distpath src-tauri/binaries/tmp
          mkdir -p src-tauri/binaries
          mv src-tauri/binaries/tmp/idjlm-server \
            src-tauri/binaries/idjlm-server-x86_64-apple-darwin

      - name: Verify spawned analyzer batch
        timeout-minutes: 5
        run: src-tauri/binaries/idjlm-server-x86_64-apple-darwin --verify-analyzer-runtime

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target x86_64-apple-darwin

      - name: Verify sealed Intel review bundle
        shell: bash
        run: |
          dmg=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          scripts/verify_macos_app_bundle.sh "$dmg" x86_64 "$(cat VERSION)"

      - name: Verify installed desktop wrapper reaches Library UI
        shell: bash
        run: |
          dmg=$(find src-tauri/target/x86_64-apple-darwin/release/bundle/dmg -name '*.dmg' -print -quit)
          test -n "$dmg"
          scripts/verify_macos_desktop_ui.sh "$dmg" x86_64 "$(cat VERSION)"

      - name: Upload macOS Intel installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-dmg-x86_64-apple-darwin
          path: src-tauri/target/x86_64-apple-darwin/release/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows installers
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify clean distributable inputs
        shell: bash
        run: |
          test ! -e .env || { echo "Refusing to package a workspace containing .env"; exit 1; }
          python - <<'PY'
          import json, pathlib, re, tomllib
          root = pathlib.Path(".")
          version = (root / "VERSION").read_text().strip()
          versions = {
              version,
              json.loads((root / "src-tauri/tauri.conf.json").read_text())["version"],
              tomllib.loads((root / "src-tauri/Cargo.toml").read_text())["package"]["version"],
              json.loads((root / "package.json").read_text())["version"],
          }
          assert re.fullmatch(r"\d+\.\d+\.\d+", version), f"VERSION is not semver: {version}"
          assert len(versions) == 1, f"Version files disagree: {versions}"
          if "${{ github.event_name }}" == "push":
              assert "${{ github.ref_name }}" == f"v{version}", "tag does not match VERSION"
          PY

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Build frontend bundle
        shell: bash
        run: |
          npm ci
          npm run build

      - name: Install Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          architecture: x64

      - name: Build PyInstaller sidecar
        shell: bash
        run: |
          python -m pip install -r requirements.txt pyinstaller
          python -m PyInstaller idjlm.spec --clean --distpath src-tauri/binaries/tmp

      - name: Stage sidecar binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path src-tauri/binaries
          Move-Item src-tauri/binaries/tmp/idjlm-server.exe `
            src-tauri/binaries/idjlm-server-x86_64-pc-windows-msvc.exe

      - name: Verify spawned analyzer batch
        timeout-minutes: 5
        shell: pwsh
        run: src-tauri/binaries/idjlm-server-x86_64-pc-windows-msvc.exe --verify-analyzer-runtime

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2.5.0

      - name: Build Tauri app
        run: tauri build --target x86_64-pc-windows-msvc

      - name: Verify NSIS installation and desktop startup
        shell: pwsh
        run: |
          $installerFile = Get-ChildItem src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe | Select-Object -First 1
          if (-not $installerFile) { throw "NSIS installer was not created" }
          $installDir = Join-Path $env:RUNNER_TEMP "idjlm-installed-windows"
          $installer = Start-Process $installerFile.FullName -ArgumentList @('/S', "/D=$installDir") -PassThru
          if (-not $installer.WaitForExit(120000)) {
            Stop-Process -Id $installer.Id -Force
            throw "NSIS installation exceeded the two-minute verification timeout"
          }
          $installer.Refresh()
          if ($installer.ExitCode -ne 0) { throw "NSIS installation failed with exit code $($installer.ExitCode)" }
          $app = Get-ChildItem $installDir -Recurse -Filter idjlm-pro.exe | Select-Object -First 1
          if (-not $app) { throw "Installed app executable was not found" }
          $stopwatch = [System.Diagnostics.Stopwatch]::StartNew()
          $process = Start-Process $app.FullName -PassThru
          $ready = $false
          try {
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $response = Invoke-WebRequest http://127.0.0.1:5050/api/version -UseBasicParsing -TimeoutSec 2
                if ($response.StatusCode -eq 200) {
                  $payload = $response.Content | ConvertFrom-Json
                  if ($payload.version -ne (Get-Content VERSION -Raw).Trim()) {
                    throw "Installed app reported version $($payload.version), expected $((Get-Content VERSION -Raw).Trim())"
                  }
                  $ready = $true
                  break
                }
              } catch {}
              Start-Sleep -Seconds 1
            }
          } finally {
            if ($process -and -not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }
          $stopwatch.Stop()
          if ($ready) { "Cold packaged wrapper readiness: $($stopwatch.Elapsed.TotalSeconds.ToString('F1'))s" | Out-File -Append $env:GITHUB_STEP_SUMMARY }
          if (-not $ready) { throw "Installed desktop app did not start its local server" }

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-msi
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: idjlm-pro-nsis
          path: src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  trusted-release-gate:
    name: Block untrusted public release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs:
      - build-macos-arm64
      - build-macos-intel
      - build-windows
    runs-on: ubuntu-latest
    steps:
      - name: Refuse unsigned publication
        run: |
          echo "No signed and notarized release workflow is configured."
          echo "Build artifacts remain private CI validation outputs."
          exit 1
